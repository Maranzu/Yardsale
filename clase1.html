<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <nav style="padding: 10px; text-align: right; position: absolute; top: 0; right: 0; z-index: 1000;">
        <button id="darkModeToggle" style="padding: 8px 12px; font-size: 12px; cursor: pointer; border-radius: 6px; border: 1px solid var(--text-input-field); background-color: var(--white); color: var(--black);">Toggle Dark Mode</button>
    </nav>
    <div class="login">
        <div class="form-container">
            <img src="./logos/logo_yard_sale.svg" alt="logo" class="logo">

            <h1 class="title">Create a new password</h1>
            <p class="subtitle">Enter a new password for you account</p>
        
            <form action="/" class="form">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" placeholder="**************" class="input input-password">
                
                <label for="password" class="label">Re-enter Password</label>
                <input type="password" id="new-password" placeholder="**************" class="input input-password">
                
                <input type="submit" value="Confirm" class="primary-button login-button">
            </form>

        </div>
    </div>
    <script src="javascript.js" defer></script>
</body>
</html>
