<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <nav style="padding: 10px; text-align: right; position: absolute; top: 0; right: 0; z-index: 1000;">
        <button id="darkModeToggle" style="padding: 8px 12px; font-size: 12px; cursor: pointer; border-radius: 6px; border: 1px solid var(--text-input-field); background-color: var(--white); color: var(--black);">Toggle Dark Mode</button>
    </nav>
    <div class="login">
        <div class="form-container">

            <h1 class="title">My account</h1>

            <form action="/" class="form">

                <div>
                <label for="password" class="label">Name</label>
                <input type="password" id="nsmr" placeholder="Maranzu" class="input input-name">
                
                <label for="password" class="label">Email address</label>
                <input type="password" id="email" placeholder="hidev@example.com" class="input input-email">
                
                <label for="password" class="label">Password</label>
                <input type="password" id="password" placeholder="**************" class="input input-password">
                </div>

                <input type="submit" value="Create" class="primary-button login-button">

                
            </form>
           
        </div>
    </div>
    <script src="javascript.js" defer></script>
</body>
</html>
